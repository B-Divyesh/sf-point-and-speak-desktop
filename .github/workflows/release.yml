name: Release desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin --bundles dmg
            rust-target: x86_64-apple-darwin
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust-target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
            rust-target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: --bundles nsis
            rust-target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag, versions, and source commit
        run: node scripts/verify-release-source.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Install Linux build tools
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libx11-dev libxrandr-dev libdbus-1-dev
      - run: npm ci
      - name: Test Windows checksum installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./tests/install-windows.ps1
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Point & Speak Desktop ${{ github.ref_name }}
          releaseBody: |
            Unsigned pilot installers. Screen capture and OCR run on the device.
            Source commit: `${{ github.sha }}`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${GITHUB_REF_NAME}" --dir release-assets
      - name: Create release metadata
        run: |
          cd release-assets
          python3 ../scripts/release-manifest.py "${GITHUB_REF_NAME}" . "${GITHUB_SHA}" > latest.json
          python3 ../scripts/release-provenance.py "${GITHUB_REF_NAME}" . "${GITHUB_SHA}" > PROVENANCE.json
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
      - name: Attach checksums and manifest
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/SHA256SUMS
            release-assets/latest.json
            release-assets/PROVENANCE.json
          tag_name: ${{ github.ref_name }}
